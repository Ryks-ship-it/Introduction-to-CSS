<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My colour card</title>
</head>
<body>
    <title>My Colour Card</title>

    <style>
       /*Universal selector*/
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .container{
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1{
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .color-card{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .color-box{
            flex: 1 1 calc(33.333% - 20px);
            height: 150px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2em;
        }
    </style>
    
    <h1>My Colour Card</h1>

    <p style="text-align: center; color: #666;">Welcome to my colour card!</p>
    <div id="my-colour-card">
            <div class="color-box" style="background-color: #ff6b6b;">Red</div>
            <div class="color-box" style="background-color: #4ecdc4;">Teal</div>
            <div class="color-box" style="background-color: #45b7d1;">Blue</div>
            <h2>About Me</h2>
            <p class detail="my detail">My name is Sam.</p>
            <p class detail="my detail">My favourite colour is red.</p>
            
    </div>

    </h2>
</body>
</html>
